name: Rust

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        runs-on: windows-latest
        strategy:
            matrix:
                include:
                    - target: x86_64-pc-windows-msvc
                      os_name: windows-msvc
                      arch: x86_64
                      filename: pocket-ark-client-plugin.asi

        steps:
            # Checkout the repo for building
            - uses: actions/checkout@v4

            # Setup rust for building the service
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            # Cache Rust dependencies and build artifacts
            - name: Cache Rust dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ matrix.target }}-cargo-

            # Build the binary
            - name: Build
              run: cargo build --verbose --target ${{ matrix.target }} -p pocket-ark-client-plugin

            # Run the tests
            - name: Run tests
              run: cargo test --verbose --target ${{ matrix.target }} -p pocket-ark-client-plugin
